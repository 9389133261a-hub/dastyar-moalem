name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create proper Flutter project
        run: |
          flutter create --org com.dastyarmoalem --project-name teacher_assistant temp_project
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/
          cd temp_project
          flutter pub get

      - name: Build APK
        run: |
          cd temp_project
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk

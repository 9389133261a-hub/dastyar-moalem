name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create proper Flutter project
        run: |
          flutter create --org com.dastyarmoalem --project-name teacher_assistant temp_project
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/
          # Update Kotlin version
          if [ -f temp_project/android/settings.gradle ]; then
            sed -i 's/version "[0-9.]*"/version "2.1.10"/g' temp_project/android/settings.gradle || true
          fi
          if grep -q "ext.kotlin_version" temp_project/android/build.gradle 2>/dev/null; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = '\''2.1.10'\''/' temp_project/android/build.gradle
          fi
          # Update compileSdk and disable minify
          sed -i 's/compileSdkVersion .*/compileSdk 36/' temp_project/android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 36/' temp_project/android/app/build.gradle || true
          # Disable R8/minify to avoid missing class errors for now
          sed -i 's/minifyEnabled true/minifyEnabled false/' temp_project/android/app/build.gradle || true
          sed -i 's/shrinkResources true/shrinkResources false/' temp_project/android/app/build.gradle || true
          cd temp_project
          flutter pub get

      - name: Build APK
        run: |
          cd temp_project
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
